
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HexCore Gaming | Headquarters</title>

    <style>

        /* ========================================== */
        /* HEXCORE // WEBSITE APPEARANCE             */
        /* ========================================== */

        body {
            margin: 0;
            background: #080711;
            color: #8CD6FD;
            font-family: Consolas, monospace;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: #B863ED;
            text-shadow: 0 0 12px #8650E8;
            pointer-events: none;
        }

        /* ========================================== */
        /* HEXCORE // MOVEMENT INSTRUCTIONS          */
        /* ========================================== */

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            padding: 12px;
            background: rgba(8, 7, 17, 0.8);
            border: 1px solid #8650E8;
            font-size: 12px;
            line-height: 1.8;
            pointer-events: none;
        }

    </style>
</head>

<body>

    <!-- ========================================== -->
    <!-- SECTION 01 // STATUS DISPLAY              -->
    <!-- ========================================== -->

    <div id="status">
        HEXCORE GAMING // HEADQUARTERS ONLINE
    </div>

    <div id="controls">
        CLICK WORLD TO LOOK AROUND
        <br>
        WASD // MOVE
        <br>
        SHIFT // MOVE FASTER
        <br>
        ESC // RELEASE MOUSE
    </div>

    <!-- ========================================== -->
    <!-- SECTION 02 // 3D SYSTEM IMPORTS           -->
    <!-- ========================================== -->

    <script type="module">

        import {
            scene,
            camera,
            renderer
        } from "./world/engine.js";

        import {
            createHeadquarters
        } from "./world/headquarters.js";

        import {
            createPlayer
        } from "./characters/player.js";


        // ==========================================
        // SECTION 03 // BUILD HEADQUARTERS
        // ==========================================

        const animateHeadquarters =
            createHeadquarters(scene);


        // ==========================================
        // SECTION 04 // CREATE PLAYER
        // ==========================================

        const updatePlayer =
            createPlayer(camera, renderer);


        // ==========================================
        // SECTION 05 // START GAME LOOP
        // ==========================================

        renderer.setAnimationLoop(() => {

            // Update player movement and camera
            updatePlayer();

            // Update animated headquarters objects
            animateHeadquarters();

            // Render the headquarters
            renderer.render(scene, camera);

        });

    </script>

</body>
</html>
