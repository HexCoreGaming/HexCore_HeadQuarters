
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HexCore Gaming | Headquarters</title>

    <style>
        /* ========================================== */
        /* HEXCORE // WEBSITE APPEARANCE             */
        /* ========================================== */

        body {
            margin: 0;
            background: #080711;
            color: #8CD6FD;
            font-family: Consolas, monospace;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: #B863ED;
            text-shadow: 0 0 12px #8650E8;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="status">
        HEXCORE GAMING // HEADQUARTERS INITIALIZED
    </div>

    <!-- ========================================== -->
    <!-- HEXCORE // 3D ENGINE ENTRY                 -->
    <!-- ========================================== -->

    <script type="module">

        import {
            scene,
            camera,
            renderer
        } from "./world/engine.js";

        import {
            createHeadquarters
        } from "./world/headquarters.js";

        // SECTION 01 // BUILD HEADQUARTERS

        createHeadquarters(scene);

        // SECTION 02 // POSITION CAMERA

        camera.position.set(12, 10, 18);
        camera.lookAt(0, 0, 0);

        // SECTION 03 // START RENDERING

        renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
        });

    </script>

</body>
</html>
