<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HexCore Gaming | Headquarters</title>

    <style>
        /* ========================================== */
        /* HEXCORE // WEBSITE APPEARANCE             */
        /* ========================================== */

        body {
            margin: 0;
            background: #080711;
            color: #8CD6FD;
            font-family: Consolas, monospace;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: #B863ED;
            text-shadow: 0 0 12px #8650E8;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="status">
        HEXCORE GAMING // 3D SYSTEM ONLINE
    </div>

    <!-- ========================================== -->
    <!-- HEXCORE // 3D ENGINE ENTRY                 -->
    <!-- ========================================== -->

    <script type="module">
        import {
            scene,
            camera,
            renderer,
            animate
        } from "./world/engine.js";

        import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

        // SECTION 01 // TEST OBJECT

        const geometry = new THREE.BoxGeometry(2, 2, 2);

        const material = new THREE.MeshStandardMaterial({
            color: 0x8650E8,
            emissive: 0x5F1DDA,
            emissiveIntensity: 0.6,
            metalness: 0.5,
            roughness: 0.3
        });

        const cube = new THREE.Mesh(geometry, material);

        scene.add(cube);

        // SECTION 02 // LIGHTING

        const light = new THREE.PointLight(
            0x8CD6FD,
            40,
            30
        );

        light.position.set(3, 5, 5);
        scene.add(light);

        scene.add(new THREE.AmbientLight(0x8650E8, 2));

        // SECTION 03 // CAMERA

        camera.position.set(0, 1, 6);
        camera.lookAt(0, 0, 0);

        // SECTION 04 // ANIMATION

        renderer.setAnimationLoop(() => {
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.01;

            renderer.render(scene, camera);
        });
    </script>

</body>
</html>
